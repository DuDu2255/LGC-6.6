# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Gradle

on:
  push:
    branches: [ "6.6.0" ]

  pull_request:
    branches: [ "6.6.0" ]

  workflow_dispatch:

concurrency:
  group: lunagc-6.6-development-build
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      with:
        cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/6.6.0' }}

    - name: Build with Gradle Wrapper
      run: ./gradlew jar --build-cache -PskipHandbook=1

    - name: Rename compiled JAR
      run: |
        if [ -f "LunaGC-6.6.0.jar" ]; then
          mv "LunaGC-6.6.0.jar" "LunaGC6.6.0.jar"
        else
          echo "错误：找不到 LunaGC-6.6.0.jar"
          exit 1
        fi

    - name: Verify compiled JAR
      run: |
        test -f LunaGC6.6.0.jar
        ls -lh LunaGC6.6.0.jar

    - name: Archive Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LunaGC6.6.0-${{ github.sha }}
        path: LunaGC6.6.0.jar
        if-no-files-found: error
        retention-days: 30
        compression-level: 0

    - name: Publish rolling development release
      if: github.event_name == 'push' && github.ref == 'refs/heads/6.6.0'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete latest-dev \
          --cleanup-tag \
          --yes || true

        gh release create latest-dev \
          LunaGC6.6.0.jar \
          --target "${GITHUB_SHA}" \
          --title "Latest LunaGC 6.6 Development Build" \
          --notes "Automatically compiled from commit ${GITHUB_SHA}." \
          --prerelease \
          --latest=false

    - name: Generate and submit dependency graph
      if: github.event_name == 'push' && github.ref == 'refs/heads/6.6.0'
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582
